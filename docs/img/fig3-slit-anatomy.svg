<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <!-- spectrum band along dispersion -->
  <rect x="60" y="95" width="760" height="150" fill="#fff8e1"/>
  <text x="70" y="115" font-size="11" fill="#b08800">spectrum disperses along this axis</text>

  <!-- slit rectangle: width along x (dispersion), length along y -->
  <rect x="372" y="95" width="36" height="150" fill="#dbe9ff" stroke="#0969da" stroke-width="2"/>

  <!-- tilted ghost -->
  <g transform="rotate(-14 390 170)">
    <rect x="372" y="95" width="36" height="150" fill="none" stroke="#0969da" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <path d="M 390 84 A 86 86 0 0 1 412 88" fill="none" stroke="#59636e" stroke-width="1.4" marker-end="url(#arr2)"/>
  <text x="424" y="82" font-size="12" fill="#1f2328"><tspan font-weight="600">tilt</tspan> — rotation about the slit centre, CCW positive, ≤ 45°</text>

  <!-- width dimension -->
  <g stroke="#59636e" stroke-width="1.3">
    <line x1="372" y1="62" x2="408" y2="62" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
    <line x1="372" y1="56" x2="372" y2="68"/>
    <line x1="408" y1="56" x2="408" y2="68"/>
  </g>
  <text x="188" y="66" font-size="12" fill="#1f2328"><tspan font-weight="600">width</tspan> — along dispersion;</text>
  <text x="188" y="82" font-size="12" fill="#1f2328">sets spectral resolution</text>

  <!-- length dimension -->
  <g stroke="#59636e" stroke-width="1.3">
    <line x1="430" y1="95" x2="430" y2="245" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
    <line x1="424" y1="95" x2="436" y2="95"/>
    <line x1="424" y1="245" x2="436" y2="245"/>
  </g>
  <text x="444" y="164" font-size="12" fill="#1f2328"><tspan font-weight="600">length</tspan> — across dispersion;</text>
  <text x="444" y="180" font-size="12" fill="#1f2328">room for object + sky background</text>

  <!-- object and offsets -->
  <g stroke="#bc4c00" stroke-width="2">
    <line x1="352" y1="262" x2="360" y2="270"/>
    <line x1="360" y1="262" x2="352" y2="270"/>
  </g>
  <text x="340" y="290" text-anchor="end" font-size="12" fill="#bc4c00"><tspan font-weight="600">object</tspan> at (x, y) / coordinates</text>

  <!-- offset arrows: object -> across -> along -> slit centre -->
  <line x1="356" y1="266" x2="388" y2="266" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrO)"/>
  <line x1="390" y1="262" x2="390" y2="176" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#arrO)"/>
  <circle cx="390" cy="170" r="3.5" fill="#0969da"/>
  <text x="412" y="316" font-size="12" fill="#bc4c00"><tspan font-weight="600">offsetAcrossSlit</tspan> — across the width;</text>
  <text x="412" y="332" font-size="12" fill="#bc4c00">non-zero drives a point source off the slit (flux loss)</text>
  <line x1="374" y1="268" x2="428" y2="310" stroke="#bc4c00" stroke-width="0.8"/>
  <text x="448" y="228" font-size="12" fill="#bc4c00"><tspan font-weight="600">offsetAlongSlit</tspan> — slides the slit along its length</text>
  <line x1="392" y1="220" x2="444" y2="224" stroke="#bc4c00" stroke-width="0.8"/>

  <!-- dispersion axis -->
  <line x1="80" y1="350" x2="250" y2="350" stroke="#59636e" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="80" y="336" font-size="12" font-weight="600" fill="#1f2328">dispersion axis</text>
  <text x="80" y="376" font-size="12" fill="#59636e">GMOS disperses along detector x (drawn here); F2 along detector y.</text>
  <text x="80" y="392" font-size="12" fill="#59636e">Width and length always mean the same thing physically — the parser and geometry swap axes, not meanings.</text>
</svg>